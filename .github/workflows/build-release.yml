name: Build Release

on:
  push:
    branches:
      - improve-ci
    paths:
      - .github/workflows/**
      - Magearna/**
      - Michina/**
      - ONNXRuntime/**
      - Tokenizers/**
      - '!**.md'

jobs:
  build-onnxruntime:
    name: Build ONNXRuntime XCFramework
    runs-on: macos-26
    outputs:
      xcframework: ${{ steps.upload-xcframework.outputs.artifact-id }}
    env:
      GENERATED_XCFRAMEWORK_PATH: ONNXRuntime/onnxruntime/build/onnxruntime.xcframework
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: true
      - name: Setup Cache
        id: cache-onnxruntime
        uses: actions/cache@v6
        with:
          key: cache-onnxruntime-${{ hashFiles('ONNXRuntime/onnxruntime', 'ONNXRuntime/Scripts/**') }}
          path: ${{ env.GENERATED_XCFRAMEWORK_PATH }}
      - name: Setup Build Cache
        id: cache-onnxruntime-build
        if: steps.cache-onnxruntime.outputs.cache-hit != 'true'
        uses: actions/cache@v6
        with:
          key: cache-onnxruntime-build-${{ hashFiles('ONNXRuntime/onnxruntime') }}
          path: ONNXRuntime/onnxruntime/build
      - name: Build
        if: steps.cache-onnxruntime.outputs.cache-hit != 'true'
        env:
          ORT_UPDATE_CMAKE: ${{ case(steps.cache-onnxruntime-build.outputs.cache-hit != 'true', true, '') }}
        run: ONNXRuntime/Scripts/build-onnxruntime.sh
      - name: Archive
        run: aa archive -D ${{ env.GENERATED_XCFRAMEWORK_PATH }} -o ${{ env.GENERATED_XCFRAMEWORK_PATH }}.aar
      - name: Upload XCFramework
        id: upload-xcframework
        uses: actions/upload-artifact@v7
        with:
          path: ${{ env.GENERATED_XCFRAMEWORK_PATH }}.aar
          archive: false

  build-tokenizers:
    name: Build Tokenizers XCFramework
    runs-on: macos-26
    outputs:
      xcframework: ${{ steps.upload-xcframework.outputs.artifact-id }}
      generated-sources: ${{ steps.upload-generated-sources.outputs.artifact-id }}
    env:
      GENERATED_XCFRAMEWORK_PATH: Tokenizers/Rust/target/tokenizers.xcframework
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Cache
        id: cache-tokenizers
        uses: actions/cache@v6
        with:
          key: cache-tokenizers-${{ hashFiles('Tokenizers/Rust/Cargo.lock', 'Tokenizers/Rust/src/**', 'Tokenizers/Scripts/**') }}
          path: |
            ${{ env.GENERATED_XCFRAMEWORK_PATH }}
            Tokenizers/Sources/Tokenizers/*bridge.rs.*
      - name: Setup Tools
        if: steps.cache-tokenizers.outputs.cache-hit != 'true'
        run: cargo install --version 1.0.194 cxxbridge-cmd
      - name: Build
        if: steps.cache-tokenizers.outputs.cache-hit != 'true'
        run: Tokenizers/Scripts/build-tokenizers.sh
      - name: Archive
        run: |
          aa archive -D ${{ env.GENERATED_XCFRAMEWORK_PATH }} -o ${{ env.GENERATED_XCFRAMEWORK_PATH }}.aar
          aa archive -D Tokenizers/Sources/Tokenizers -o ${{ env.GENERATED_XCFRAMEWORK_PATH }}.generated-sources.aar \
            -include-regex 'bridge.rs.'
      - name: Upload XCFramework
        id: upload-xcframework
        uses: actions/upload-artifact@v7
        with:
          path: ${{ env.GENERATED_XCFRAMEWORK_PATH }}.aar
          archive: false
      - name: Upload Additional Sources
        id: upload-generated-sources
        uses: actions/upload-artifact@v7
        with:
          path: ${{ env.GENERATED_XCFRAMEWORK_PATH }}.generated-sources.aar
          archive: false

  build-machina:
    name: Build Machina
    runs-on: macos-26
    needs:
      - build-onnxruntime
      - build-tokenizers
    env:
      XCODE_WORKSPACE: ${{ github.workspace }}/Michina.xcworkspace
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive
      - name: Setup Xcode Cache
        id: cache-tokenizers
        uses: actions/cache@v6
        with:
          key: cache-xcode
          path: DerivedData

      - name: Install Tools
        run: |
          gem install xcpretty
          brew install git-tools

      - name: Prepare Paths
        id: paths
        env:
          ARTIFACTS_PATH: ${{ runner.temp }}/Artifacts
          DERIVED_DATA_PATH: ${{ github.workspace }}/DerivedData
          EXPORTS_PATH: ${{ runner.temp }}/Exports
          SECRETS_PATH: ${{ runner.temp }}/Secrets
        run: |
          mkdir -p ${{ env.ARTIFACTS_PATH }}
          echo "artifacts=${{ env.ARTIFACTS_PATH }}" >> $GITHUB_OUTPUT

          mkdir -p ${{ env.DERIVED_DATA_PATH }}
          echo "derived-data=${{ env.DERIVED_DATA_PATH }}" >> $GITHUB_OUTPUT

          mkdir -p ${{ env.EXPORTS_PATH }}
          echo "exports=${{ env.EXPORTS_PATH }}" >> $GITHUB_OUTPUT

          mkdir -p ${{ env.SECRETS_PATH }}
          echo "secrets=${{ env.SECRETS_PATH }}" >> $GITHUB_OUTPUT

      - name: Download Artifacts
        uses: actions/download-artifact@v8
        with:
          artifact-ids: >
            ${{ needs.build-onnxruntime.outputs.xcframework }},
            ${{ needs.build-tokenizers.outputs.xcframework }},
            ${{ needs.build-tokenizers.outputs.generated-sources }}
          path: ${{ steps.paths.outputs.artifacts }}
      - name: Extract Artifacts
        env:
          ARTIFACTS_PATH: ${{ steps.paths.outputs.artifacts }}
        run: |
          mkdir -p ONNXRuntime/onnxruntime/build
          aa extract -i ${{ env.ARTIFACTS_PATH }}/onnxruntime.xcframework.aar -d ONNXRuntime/onnxruntime/build

          mkdir -p Tokenizers/Rust/target
          aa extract -i ${{ env.ARTIFACTS_PATH }}/tokenizers.xcframework.aar -d Tokenizers/Rust/target
          aa extract -i ${{ env.ARTIFACTS_PATH }}/tokenizers.xcframework.generated-sources.aar -d Tokenizers/Sources

      - name: Setup Secrets
        id: secrets
        env:
          MAC_DEVELOPMENT_CERTIFICATE_PATH: ${{ steps.paths.outputs.secrets }}/mac-development.p12
          DEVELOPER_ID_CERTIFICATE_PATH: ${{ steps.paths.outputs.secrets }}/developer-id.p12
          APPLE_DISTRIBUTION_CERTIFICATE_PATH: ${{ steps.paths.outputs.secrets }}/apple-distribution.p12
          MAC_INSTALLER_DISTRIBUTION_CERTIFICATE_PATH: ${{ steps.paths.outputs.secrets }}/mac-installer-distribution.p12
          KEYCHAIN_PATH: ${{ steps.paths.outputs.secrets }}/build.keychain

          APP_STORE_CONNECT_API_KEY_PATH: ${{ steps.paths.outputs.secrets }}/app-store-connect-api.p8
        run: |
          KEYCHAIN_PASSWORD=$(openssl rand -base64 12)

          security create-keychain -p $KEYCHAIN_PASSWORD ${{ env.KEYCHAIN_PATH }}
          security set-keychain-settings -lut 21600 ${{ env.KEYCHAIN_PATH }}
          security unlock-keychain -p $KEYCHAIN_PASSWORD ${{ env.KEYCHAIN_PATH }}

          echo -n ${{ secrets.XCODE_MAC_DEVELOPMENT_CERTIFICATE }}            \
            | base64 --decode -o ${{ env.MAC_DEVELOPMENT_CERTIFICATE_PATH }}
          security import ${{ env.MAC_DEVELOPMENT_CERTIFICATE_PATH }}     \
            -P ${{ secrets.XCODE_MAC_DEVELOPMENT_CERTIFICATE_PASSWORD }}  \
            -t cert -f pkcs12                                             \
            -A -k ${{ env.KEYCHAIN_PATH }}

          echo -n ${{ secrets.XCODE_DEVELOPER_ID_CERTIFICATE }}           \
            | base64 --decode -o ${{ env.DEVELOPER_ID_CERTIFICATE_PATH }}
          security import ${{ env.DEVELOPER_ID_CERTIFICATE_PATH }}    \
            -P ${{ secrets.XCODE_DEVELOPER_ID_CERTIFICATE_PASSWORD }} \
            -t cert -f pkcs12                                         \
            -A -k ${{ env.KEYCHAIN_PATH }}

          echo -n ${{ secrets.XCODE_APPLE_DISTRIBUTION_CERTIFICATE }}           \
            | base64 --decode -o ${{ env.APPLE_DISTRIBUTION_CERTIFICATE_PATH }}
          security import ${{ env.APPLE_DISTRIBUTION_CERTIFICATE_PATH }}    \
            -P ${{ secrets.XCODE_APPLE_DISTRIBUTION_CERTIFICATE_PASSWORD }} \
            -t cert -f pkcs12                                               \
            -A -k ${{ env.KEYCHAIN_PATH }}
          
          echo -n ${{ secrets.XCODE_MAC_INSTALLER_DISTRIBUTION_CERTIFICATE }}           \
            | base64 --decode -o ${{ env.MAC_INSTALLER_DISTRIBUTION_CERTIFICATE_PATH }}
          security import ${{ env.MAC_INSTALLER_DISTRIBUTION_CERTIFICATE_PATH }}    \
            -P ${{ secrets.XCODE_MAC_INSTALLER_DISTRIBUTION_CERTIFICATE_PASSWORD }} \
            -t cert -f pkcs12                                                       \
            -A -k ${{ env.KEYCHAIN_PATH }}

          security set-key-partition-list -S apple-tool:,apple: ${{ env.KEYCHAIN_PATH }}
          security list-keychain -d user -s ${{ env.KEYCHAIN_PATH }}

          echo -n ${{ secrets.APP_STORE_CONNECT_API_KEY }}                  \
            | base64 --decode -o ${{ env.APP_STORE_CONNECT_API_KEY_PATH }}
          echo "app-store-connect-api-key-path=${{ env.APP_STORE_CONNECT_API_KEY_PATH }}" >> $GITHUB_OUTPUT

      - name: Manage Build Number
        run: |
          echo "Set build number to ${{ github.run_number }}"
          sed -i '' 's/CURRENT_PROJECT_VERSION = .*/CURRENT_PROJECT_VERSION = ${{ github.run_number }};/g' \
            Michina/Michina.xcodeproj/project.pbxproj

      - name: Prepare Packages
        run: |
          Magearna/Scripts/prepare-proto.sh

          SPM_SECURITY_PATH=~/Library/org.swift.swiftpm/security
          mkdir -p $SPM_SECURITY_PATH
          cp ci_scripts/ci_post_clone/Security/plugins.json $SPM_SECURITY_PATH

      - name: Resolve Package Dependencies
        run: |
          xcodebuild -resolvePackageDependencies                      \
            -workspace ${{ env.XCODE_WORKSPACE }}                     \
            -derivedDataPath ${{ steps.paths.outputs.derived-data }}  \
            -scheme Michina                                           \
            -hideShellScriptEnvironment

      - name: Restore Modification Time
        env:
          CHECKOUTS_PATH: ${{ steps.paths.outputs.derived-data }}/SourcePackages/checkouts
        run: |
          git restore-mtime
          for path in ${{ env.CHECKOUTS_PATH }}/*
          do
            git restore-mtime -C $path
          done
          defaults write com.apple.dt.XCBuild IgnoreFileSystemDeviceInodeChanges -bool YES

      - name: Archive
        id: archive
        env:
          ARCHIVE_PATH: ${{ runner.temp }}/Michina.xcarchive
        run: |
          set -o pipefail

          xcodebuild archive                                          \
            -workspace ${{ env.XCODE_WORKSPACE }}                     \
            -scheme Michina                                           \
            -destination generic/platform=macOS                       \
            -archivePath ${{ env.ARCHIVE_PATH }}                      \
            -derivedDataPath ${{ steps.paths.outputs.derived-data }}  \
            -hideShellScriptEnvironment                               \
            | xcpretty

          ditto -c -k --keepParent ${{ env.ARCHIVE_PATH }} ${{ env.ARCHIVE_PATH }}.zip
          echo "archive-path=${{ env.ARCHIVE_PATH }}" >> $GITHUB_OUTPUT

      - name: Export and Notarize App for Developer ID
        id: export-developer-id
        background: true
        env:
          EXPORT_OPTIONS_PATH: ${{ steps.paths.outputs.exports }}/developer-id.plist
          EXPORT_PATH: ${{ steps.paths.outputs.exports }}/developer-id
          APP_PATH: ${{ steps.paths.outputs.exports }}/developer-id/Michina.app
        run: |
          plutil -create xml1 ${{ env.EXPORT_OPTIONS_PATH }}
          plutil -insert method -string developer-id ${{ env.EXPORT_OPTIONS_PATH }}

          mkdir -p ${{ env.EXPORT_PATH }}
          xcodebuild -exportArchive                                 \
            -archivePath ${{ steps.archive.outputs.archive-path }}  \
            -exportPath ${{ env.EXPORT_PATH }}                      \
            -exportOptionsPlist ${{ env.EXPORT_OPTIONS_PATH }}      \
            -hideShellScriptEnvironment

          ditto -c -k --keepParent ${{ env.APP_PATH }} ${{ env.APP_PATH }}.zip
          xcrun notarytool submit ${{ env.APP_PATH }}.zip                     \
            --key ${{ steps.secrets.outputs.app-store-connect-api-key-path }} \
            --key-id ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}              \
            --issuer ${{ secrets.APP_STORE_CONNECT_API_KEY_ISSUER_ID }}       \
            --wait
          xcrun stapler staple ${{ env.APP_PATH }}
          rm ${{ env.APP_PATH }}.zip

          ditto -c -k --keepParent ${{ env.EXPORT_PATH }} ${{ env.EXPORT_PATH }}.zip
          echo "export-path=${{ env.EXPORT_PATH }}.zip" >> $GITHUB_OUTPUT

      - name: Export and Upload Package to App Store Connect
        id: export-app-store-connect
        background: true
        env:
          EXPORT_OPTIONS_PATH: ${{ steps.paths.outputs.exports }}/app-store-connect.plist
          EXPORT_PATH: ${{ steps.paths.outputs.exports }}/app-store-connect
          PACKAGE_PATH: ${{ steps.paths.outputs.exports }}/app-store-connect/Michina.pkg
        run: |
          plutil -create xml1 ${{ env.EXPORT_OPTIONS_PATH }}
          plutil -insert method -string app-store-connect ${{ env.EXPORT_OPTIONS_PATH }}
          plutil -insert destination -string upload ${{ env.EXPORT_OPTIONS_PATH }}

          mkdir -p ${{ env.EXPORT_PATH }}
          xcodebuild -exportArchive                                                             \
            -archivePath ${{ steps.archive.outputs.archive-path }}                              \
            -exportPath ${{ env.EXPORT_PATH }}                                                  \
            -exportOptionsPlist ${{ env.EXPORT_OPTIONS_PATH }}                                  \
            -allowProvisioningUpdates                                                           \
            -authenticationKeyPath ${{ steps.secrets.outputs.app-store-connect-api-key-path }}  \
            -authenticationKeyID ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}                    \
            -authenticationKeyIssuerID ${{ secrets.APP_STORE_CONNECT_API_KEY_ISSUER_ID }}       \
            -hideShellScriptEnvironment

          echo "export-path=${{ env.EXPORT_PATH }}" >> $GITHUB_OUTPUT

      - name: Wait for Export Steps
        wait-all:

      - name: Upload Archive
        uses: actions/upload-artifact@v7
        with:
          path: ${{ steps.archive.outputs.archive-path }}.zip
          archive: false
      - name: Upload Developer ID Archive
        uses: actions/upload-artifact@v7
        with:
          name: developer-id
          path: ${{ steps.export-developer-id.outputs.export-path }}
      - name: Upload App Store Connect Archive
        uses: actions/upload-artifact@v7
        with:
          name: app-store-connect
          path: ${{ steps.export-app-store-connect.outputs.export-path }}
