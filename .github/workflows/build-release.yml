name: Build Release

on:
  push:
    branches:
      - improve-ci
    paths:
      - .github/workflows/**
      - Magearna/**
      - Michina/**
      - ONNXRuntime/**
      - Tokenizers/**
      - '!**.md'

jobs:
  build-onnxruntime:
    name: Build ONNXRuntime XCFramework
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: true
      - name: Setup Cache
        id: cache-onnxruntime
        uses: actions/cache@v6
        with:
          key: cache-onnxruntime-${{ hashFiles('ONNXRuntime/onnxruntime', 'ONNXRuntime/Scripts/**') }}
          path: ONNXRuntime/onnxruntime/build/onnxruntime.xcframework
      - name: Setup Build Cache
        id: cache-onnxruntime-build
        if: steps.cache-onnxruntime.outputs.cache-hit != 'true'
        uses: actions/cache@v6
        with:
          key: cache-onnxruntime-buid
          path: ONNXRuntime/onnxruntime/build
      - name: Build
        if: steps.cache-onnxruntime.outputs.cache-hit != 'true'
        env:
          ARCHIVE_XCFRAMEWORK: true
          ORT_UPDATE_CMAKE: true
        run: ONNXRuntime/Scripts/build-onnxruntime.sh
      - name: Upload Binary
        uses: actions/upload-artifact@v7
        with:
          path: ONNXRuntime/onnxruntime/build/onnxruntime.xcframework.zip
          archive: false

  build-tokenizers:
    name: Build Tokenizers XCFramework
    runs-on: macos-26
    env:
      MACOSX_DEPLOYMENT_TARGET: 26.0
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Cache
        id: cache-tokenizers
        uses: actions/cache@v6
        with:
          key: cache-tokenizers-${{ hashFiles('Tokenizers/Rust/Cargo.lock', 'Tokenizers/Rust/src/**', 'Tokenizers/Scripts/**') }}
          path: Tokenizers/Rust/target/tokenizers.xcframework
      - name: Setup Tools
        if: steps.cache-tokenizers.outputs.cache-hit != 'true'
        run: cargo install cxxbridge-cmd
      - name: Build
        if: steps.cache-tokenizers.outputs.cache-hit != 'true'
        env:
          ARCHIVE_XCFRAMEWORK: true
        run: Tokenizers/Scripts/build_tokenizers.sh
      - name: Upload Binary
        uses: actions/upload-artifact@v7
        with:
          path: Tokenizers/Rust/target/tokenizers.xcframework.zip
          archive: false
